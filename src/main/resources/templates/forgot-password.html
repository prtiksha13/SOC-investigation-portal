<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOC Sentinel | Reset Password</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="page-shell">
    <aside class="brand-panel">
      <div class="brand-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 18.5 5v6.2c0 4.2-2.6 8.1-6.5 10.3-3.9-2.2-6.5-6.1-6.5-10.3V5L12 2.5z"/></svg>
        </div>
        <div>
          <p class="eyebrow">SECURITY OPERATIONS CENTER</p>
          <h1>SOC SENTINEL</h1>
        </div>
      </div>
    </aside>

    <main class="login-panel">
      <div class="card">
        <div class="card-header">
          <div>
            <p class="section-kicker">Security Operations Center Portal</p>
            <h2>Reset your password</h2>
          </div>
        </div>

        <div th:if="${error}" class="error-message visible" role="alert" th:text="${error}"></div>

        <form th:if="${verified == null or !verified}" method="post" action="/forgot-password/verify" class="login-form" autocomplete="off">
          <label class="field">
            <span>Username</span>
            <input type="text" name="username" th:value="${username}" placeholder="Enter your username" required autofocus>
          </label>
          <button type="submit" class="login-button">Continue</button>
        </form>

        <form th:if="${verified}" method="post" action="/forgot-password/reset" class="login-form" autocomplete="off">
          <input type="hidden" name="username" th:value="${username}">
          <label class="field">
            <span>New password</span>
            <input type="password" name="newPassword" placeholder="Enter a new password" required autofocus>
          </label>
          <label class="field">
            <span>Confirm password</span>
            <input type="password" name="confirmPassword" placeholder="Confirm your new password" required>
          </label>
          <button type="submit" class="login-button">Reset password</button>
        </form>

        <p class="meta-row"><a href="/login" class="meta-link">Back to login</a></p>
      </div>
    </main>
  </div>
</body>
</html>
